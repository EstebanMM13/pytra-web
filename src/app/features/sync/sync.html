<app-navbar />

<main class="mx-auto flex max-w-[1000px] flex-col gap-4 px-5 pt-3 pb-8 md:gap-6 md:px-6 md:pt-10 md:pb-12 lg:px-10">
  <header>
    <h1 class="font-display text-[28px] font-bold tracking-[-0.03em] md:text-[34px]">{{ 'sync.title' | translate }}</h1>
    <p class="mt-1 text-sm text-text-3 md:text-[15px]">{{ 'sync.subtitle' | translate }}</p>
  </header>

  <!-- Steam: renders its own platform card (badge and body follow the link status). -->
  <app-steam-panel />

  <!-- PlayStation: announced, not available yet -->
  <app-platform-card
    platform="playstation"
    disabled
    [name]="'sync.playstation' | translate"
    [subtitle]="'sync.playstationHint' | translate"
    [icon]="icons.gamepad2"
  >
    <span platformBadge class="rounded-full bg-gold-tint px-[9px] py-[3px] text-xs font-medium whitespace-nowrap text-gold-tint-fg">
      {{ 'sync.comingSoon' | translate }}
    </span>
  </app-platform-card>
</main>
