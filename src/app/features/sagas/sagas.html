<app-navbar />

<div class="mx-auto max-w-2xl px-6 py-10">
  <h1 class="mb-6 text-2xl font-semibold text-text">Sagas</h1>

  <form [formGroup]="createForm" (ngSubmit)="create()" class="mb-8 flex gap-2">
    <input
      type="text"
      formControlName="name"
      placeholder="Nombre de la saga"
      class="flex-1 rounded-lg border border-border bg-bg text-text-2 px-3 py-2 focus:border-brand-light focus:outline-none"
    />
    <button
      type="submit"
      class="rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-brand-dark"
    >
      Añadir
    </button>
  </form>

  @if (error()) {
    <p class="mb-4 text-sm text-danger">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="text-muted">Cargando...</p>
  } @else if (sagas().length === 0) {
    <p class="text-muted">Todavía no tienes sagas.</p>
  } @else {
    <ul class="divide-y divide-divider rounded-xl border border-border bg-surface">
      @for (saga of sagas(); track saga.id) {
        <li class="flex items-center justify-between px-4 py-3">
          @if (editingId() === saga.id) {
            <form [formGroup]="editForm" (ngSubmit)="saveEdit(saga)" class="flex flex-1 gap-2">
              <input
                type="text"
                formControlName="name"
                class="flex-1 rounded-lg border border-border bg-bg text-text-2 px-3 py-1.5 focus:border-brand-light focus:outline-none"
              />
              <button type="submit" class="text-sm font-medium text-text hover:underline">
                Guardar
              </button>
              <button
                type="button"
                (click)="cancelEdit()"
                class="text-sm text-faint hover:underline"
              >
                Cancelar
              </button>
            </form>
          } @else {
            <div>
              <a [routerLink]="['/sagas', saga.id]" class="text-text-2 hover:underline">
                {{ saga.name }}
              </a>
            </div>
            <div class="flex gap-3 text-sm">
              <button
                type="button"
                (click)="startEdit(saga)"
                class="font-medium text-text-3 hover:underline"
              >
                Renombrar
              </button>
              <button
                type="button"
                (click)="remove(saga)"
                class="font-medium text-danger hover:underline"
              >
                Borrar
              </button>
            </div>
          }
        </li>
      }
    </ul>
  }
</div>
