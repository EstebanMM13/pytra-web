<app-navbar />

<div class="mx-auto max-w-2xl px-6 py-10">
  <h1 class="mb-6 text-2xl font-semibold text-slate-900">Sagas</h1>

  <form [formGroup]="createForm" (ngSubmit)="create()" class="mb-8 flex gap-2">
    <input
      type="text"
      formControlName="name"
      placeholder="Nombre de la saga"
      class="flex-1 rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-2 focus:border-brand-light focus:outline-none"
    />
    <button
      type="submit"
      class="rounded-lg bg-brand px-4 py-2 font-medium text-white hover:bg-brand-dark"
    >
      Añadir
    </button>
  </form>

  @if (error()) {
    <p class="mb-4 text-sm text-red-600">{{ error() }}</p>
  }

  @if (loading()) {
    <p class="text-slate-500">Cargando...</p>
  } @else if (sagas().length === 0) {
    <p class="text-slate-500">Todavía no tienes sagas.</p>
  } @else {
    <ul class="divide-y divide-slate-200 rounded-xl border border-slate-200 bg-surface">
      @for (saga of sagas(); track saga.id) {
        <li class="flex items-center justify-between px-4 py-3">
          @if (editingId() === saga.id) {
            <form [formGroup]="editForm" (ngSubmit)="saveEdit(saga)" class="flex flex-1 gap-2">
              <input
                type="text"
                formControlName="name"
                class="flex-1 rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-1.5 focus:border-brand-light focus:outline-none"
              />
              <button type="submit" class="text-sm font-medium text-slate-900 hover:underline">
                Guardar
              </button>
              <button
                type="button"
                (click)="cancelEdit()"
                class="text-sm text-slate-400 hover:underline"
              >
                Cancelar
              </button>
            </form>
          } @else {
            <div>
              <a [routerLink]="['/sagas', saga.id]" class="text-slate-800 hover:underline">
                {{ saga.name }}
              </a>
            </div>
            <div class="flex gap-3 text-sm">
              <button
                type="button"
                (click)="startEdit(saga)"
                class="font-medium text-slate-600 hover:underline"
              >
                Renombrar
              </button>
              <button
                type="button"
                (click)="remove(saga)"
                class="font-medium text-red-600 hover:underline"
              >
                Borrar
              </button>
            </div>
          }
        </li>
      }
    </ul>
  }
</div>
