<div class="flex min-h-screen items-center justify-center bg-hover px-4">
  <div class="w-full max-w-sm rounded-xl bg-surface p-8 text-center shadow-sm">
    @if (failed()) {
      <p class="mb-4 text-danger">{{ errorKey() | translate }}</p>
      <a routerLink="/login" class="font-medium text-text hover:underline">
        {{ 'auth.register.login' | translate }}
      </a>
    } @else {
      <p class="text-text-3">{{ 'auth.oauthCallback.processing' | translate }}</p>
    }
  </div>
</div>
