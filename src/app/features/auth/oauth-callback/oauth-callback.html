<app-auth-shell>
  @if (failed()) {
    <h1 class="text-h1 font-semibold tracking-[-0.02em] md:text-stat">
      {{ 'auth.oauthCallback.errorTitle' | translate }}
    </h1>
    <p class="text-sm leading-relaxed text-danger" role="alert">{{ errorKey() | translate }}</p>
    <a routerLink="/login" class="press auth-primary">{{ 'auth.verifyEmail.goToLogin' | translate }}</a>
  } @else {
    <h1 class="text-h1 font-semibold tracking-[-0.02em] md:text-stat">{{ 'auth.login.title' | translate }}</h1>
    <p class="text-body text-muted" role="status">{{ 'auth.oauthCallback.processing' | translate }}</p>
  }
</app-auth-shell>
