<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm rounded-xl bg-surface p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">{{ 'auth.register.title' | translate }}</h1>

    @if (submitted()) {
      <p class="text-sm text-green-700">{{ 'auth.register.success' | translate }}</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">
            {{ 'auth.register.username' | translate }}
          </label>
          <input
            type="text"
            formControlName="username"
            class="w-full rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-2 focus:border-brand-light focus:outline-none"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">
            {{ 'auth.register.email' | translate }}
          </label>
          <input
            type="email"
            formControlName="email"
            class="w-full rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-2 focus:border-brand-light focus:outline-none"
          />
        </div>

        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">
            {{ 'auth.register.password' | translate }}
          </label>
          <input
            type="password"
            formControlName="password"
            class="w-full rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-2 focus:border-brand-light focus:outline-none"
          />
        </div>

        @if (errorKey()) {
          <p class="text-sm text-red-600">{{ errorKey()! | translate }}</p>
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full rounded-lg bg-brand py-2 font-medium text-white transition hover:bg-brand-dark disabled:opacity-50"
        >
          {{ 'auth.register.submit' | translate }}
        </button>
      </form>
    }

    <p class="mt-6 text-center text-sm text-slate-500">
      {{ 'auth.register.hasAccount' | translate }}
      <a routerLink="/login" class="font-medium text-slate-900 hover:underline">
        {{ 'auth.register.login' | translate }}
      </a>
    </p>
  </div>
</div>
