<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm rounded-xl bg-surface p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-semibold text-slate-900">{{ 'auth.login.title' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">
          {{ 'auth.login.identifier' | translate }}
        </label>
        <input
          type="text"
          formControlName="identifier"
          autocomplete="username"
          class="w-full rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-2 focus:border-brand-light focus:outline-none"
        />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-slate-700">
          {{ 'auth.login.password' | translate }}
        </label>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full rounded-lg border border-slate-300 bg-ink text-slate-800 px-3 py-2 focus:border-brand-light focus:outline-none"
        />
      </div>

      @if (errorKey()) {
        <p class="text-sm text-red-600">{{ errorKey()! | translate }}</p>
      }
      @if (unverifiedEmail() !== null) {
        <app-resend-verification [email]="unverifiedEmail()!" />
      }

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-lg bg-brand py-2 font-medium text-white transition hover:bg-brand-dark disabled:opacity-50"
      >
        {{ 'auth.login.submit' | translate }}
      </button>
    </form>

    <button
      type="button"
      (click)="loginWithGoogle()"
      class="mt-3 w-full rounded-lg border border-slate-300 py-2 font-medium text-slate-700 transition hover:bg-slate-50"
    >
      {{ 'auth.login.withGoogle' | translate }}
    </button>

    <div class="mt-6 flex justify-between text-sm">
      <a routerLink="/forgot-password" class="text-slate-500 hover:underline">
        {{ 'auth.login.forgotPassword' | translate }}
      </a>
      <span class="text-slate-500">
        {{ 'auth.login.noAccount' | translate }}
        <a routerLink="/register" class="font-medium text-slate-900 hover:underline">
          {{ 'auth.login.register' | translate }}
        </a>
      </span>
    </div>
  </div>
</div>
