<div class="flex min-h-screen items-center justify-center bg-hover px-4">
  <div class="w-full max-w-sm rounded-xl bg-surface p-8 shadow-sm">
    <h1 class="mb-6 text-2xl font-semibold text-text">{{ 'auth.forgotPassword.title' | translate }}</h1>

    @if (sent()) {
      <p class="text-sm text-success">{{ 'auth.forgotPassword.sent' | translate }}</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="mb-1 block text-sm font-medium text-text-2">
            {{ 'auth.forgotPassword.email' | translate }}
          </label>
          <input
            type="email"
            formControlName="email"
            class="w-full rounded-lg border border-border bg-bg text-text-2 px-3 py-2 focus:border-brand-light focus:outline-none"
          />
        </div>

        @if (errorKey()) {
          <p class="text-sm text-danger">{{ errorKey()! | translate }}</p>
        }

        <button
          type="submit"
          [disabled]="submitting()"
          class="w-full rounded-lg bg-brand py-2 font-medium text-white transition hover:bg-brand-dark disabled:opacity-50"
        >
          {{ 'auth.forgotPassword.submit' | translate }}
        </button>
      </form>
    }

    <p class="mt-6 text-center text-sm">
      <a routerLink="/login" class="font-medium text-text hover:underline">
        {{ 'auth.forgotPassword.backToLogin' | translate }}
      </a>
    </p>
  </div>
</div>
