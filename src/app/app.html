<!-- Fixed background layers (aura + grain) behind every screen. -->
<div class="bg-aura" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<router-outlet />

<!-- Native cold-start intro (never on the web or with reduced motion). Deferred so its chunk
     stays out of the initial bundle; the WebView already shows the same purple meanwhile. -->
@if (showSplash) {
  @defer (on immediate) {
    <app-splash-overlay />
  }
}

@for (request of runFormRequests(); track request) {
  @defer {
    <app-run-form [request]="request" />
  }
}

<!-- Deferred: keeps the toast host and the icon set out of the initial bundle; the toast
     queue lives in ToastService, so toasts raised before it loads still show. -->
@defer (on idle) {
  <app-toast-host />
}
