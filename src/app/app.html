<!-- Fixed background layers (grid + aura) behind every screen. -->
<div class="bg-aura" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<router-outlet />

@for (request of runFormRequests(); track request) {
  @defer {
    <app-run-form [request]="request" />
  }
}

<!-- Deferred: keeps the toast host and the icon set out of the initial bundle; the toast
     queue lives in ToastService, so toasts raised before it loads still show. -->
@defer (on idle) {
  <app-toast-host />
}
