<!-- Fixed background aura behind every screen. -->
<div class="bg-aura" aria-hidden="true"></div>

<router-outlet />

<!-- Brand intro (SplashGate: native cold start, once per web session; never with reduced
     motion). Deferred so its chunk stays out of the initial bundle; on native the system splash
     stays up meanwhile. The routed screen keeps loading its data underneath. -->
@if (showSplash()) {
  @defer (on immediate) {
    <app-splash-overlay />
  }
}

@for (request of runFormRequests(); track request) {
  @defer {
    <app-run-form [request]="request" />
  }
}

<!-- Deferred: keeps the toast host and the icon set out of the initial bundle; the toast
     queue lives in ToastService, so toasts raised before it loads still show. -->
@defer (on idle) {
  <app-toast-host />
}
