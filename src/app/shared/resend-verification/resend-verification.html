<div class="flex flex-col gap-3 rounded-[10px] border border-border bg-surface p-4">
  <p class="text-sm text-text-3">{{ 'auth.resendVerification.prompt' | translate }}</p>

  <label for="resend-email" class="auth-label">
    {{ 'auth.register.email' | translate }}
    <input id="resend-email" type="email" autocomplete="email" [formControl]="emailControl" class="auth-input bg-bg!" />
    @if (emailControl.touched && emailControl.invalid) {
      <span class="text-xs text-danger">{{ 'auth.resendVerification.invalidEmail' | translate }}</span>
    }
  </label>

  @if (feedbackKey()) {
    <p class="text-sm text-success">{{ feedbackKey()! | translate }}</p>
  }
  @if (errorKey()) {
    <p class="text-sm text-danger" role="alert">{{ errorKey()! | translate }}</p>
  }

  <button type="button" (click)="resend()" [disabled]="sending() || cooldown() > 0" class="auth-secondary">
    @if (cooldown() > 0) {
      {{ 'auth.resendVerification.cooldown' | translate: { seconds: cooldown() } }}
    } @else {
      {{ 'auth.resendVerification.submit' | translate }}
    }
  </button>
</div>
