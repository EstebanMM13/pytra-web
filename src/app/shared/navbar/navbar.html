<nav class="border-b border-slate-200 bg-surface px-6 py-3">
  <div class="mx-auto flex max-w-5xl items-center justify-between">
    <a routerLink="/dashboard" class="flex items-center">
      <img src="brand/lockup-horizontal-dark-bg.png" alt="Pytra" class="h-8 w-auto" />
    </a>

    <div class="flex items-center gap-6 text-sm font-medium text-slate-600">
      <a
        routerLink="/dashboard"
        routerLinkActive="text-brand-light"
        class="hover:text-brand-light"
      >
        Dashboard
      </a>
      <a routerLink="/sagas" routerLinkActive="text-brand-light" class="hover:text-brand-light">
        Sagas
      </a>
      <a routerLink="/games" routerLinkActive="text-brand-light" class="hover:text-brand-light">
        Games
      </a>
      <a routerLink="/steam" routerLinkActive="text-brand-light" class="hover:text-brand-light">
        Steam
      </a>
      @if (displayName(); as name) {
        <a
          routerLink="/profile"
          routerLinkActive="border-brand-light text-brand-light"
          class="max-w-24 truncate rounded-full border border-slate-200 bg-ink px-3 py-1 text-xs text-slate-700 hover:border-brand-light hover:text-brand-light sm:max-w-48"
          [title]="name"
        >
          {{ name }}
        </a>
      }
      <button type="button" (click)="logout()" class="text-slate-400 hover:text-slate-900">
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>
