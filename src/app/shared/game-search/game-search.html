<div class="fixed inset-0 z-50 flex items-start justify-center bg-overlay px-4 pt-[12vh]" (click)="close()">
  <div
    class="w-full max-w-lg animate-modal-in overflow-hidden rounded-2xl border border-border bg-surface shadow-[0_40px_100px_#000a]"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'search.title' | translate"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center gap-3 border-b border-divider px-4">
      <svg lucideSearch [size]="18" class="shrink-0 text-muted"></svg>
      <input
        #searchInput
        type="text"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="game-search-results"
        [attr.aria-expanded]="results().length > 0"
        [attr.aria-activedescendant]="results().length ? 'game-search-' + activeIndex() : null"
        [value]="query()"
        (input)="onQuery($any($event.target).value)"
        (keydown)="onKeydown($event)"
        [placeholder]="'search.placeholder' | translate"
        class="h-14 min-w-0 flex-1 border-0 bg-transparent text-base text-text focus:shadow-none"
      />
      <button
        type="button"
        (click)="close()"
        class="rounded-md p-1 text-muted hover:text-text"
        [attr.aria-label]="'search.close' | translate"
      >
        <svg lucideX [size]="18"></svg>
      </button>
    </div>

    <ul id="game-search-results" role="listbox" class="max-h-80 overflow-y-auto p-2">
      @if (games() === null) {
        <li class="px-3 py-6 text-center text-sm text-muted">{{ 'search.loading' | translate }}</li>
      } @else {
        @for (game of results(); track game.id; let i = $index) {
          <li
            [id]="'game-search-' + i"
            role="option"
            [attr.aria-selected]="i === activeIndex()"
            (click)="open(game)"
            (mousemove)="activeIndex.set(i)"
            class="flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm"
            [class.bg-brand-tint]="i === activeIndex()"
          >
            <span class="min-w-0 flex-1 truncate" [class]="i === activeIndex() ? 'text-brand-lighter' : 'text-text-2'">
              {{ game.name }}
            </span>
            @if (game.sagaName) {
              <span class="shrink-0 truncate text-xs text-faint">{{ game.sagaName }}</span>
            }
          </li>
        } @empty {
          <li class="px-3 py-6 text-center text-sm text-muted">{{ 'search.empty' | translate }}</li>
        }
      }
    </ul>

    <p class="border-t border-divider px-4 py-2.5 text-xs text-faint">{{ 'search.hint' | translate }}</p>
  </div>
</div>
