apply plugin: 'com.android.application'

// Release signing. One key signs every published APK so installs from GitHub update in place.
// Sources, first match wins:
//   1. CI env vars: ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
//   2. A properties file outside the repo (storeFile, storePassword, keyAlias, keyPassword):
//      -PpytraReleaseProperties=<path>, else ~/.android/pytra-release.properties
// Without either, release builds are unsigned and debug builds are unaffected.
def releaseSigning = null
if (System.getenv('ANDROID_KEYSTORE_FILE')) {
    releaseSigning = [
        storeFile    : System.getenv('ANDROID_KEYSTORE_FILE'),
        storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
        keyAlias     : System.getenv('ANDROID_KEY_ALIAS'),
        keyPassword  : System.getenv('ANDROID_KEY_PASSWORD'),
    ]
} else {
    def propsPath = project.findProperty('pytraReleaseProperties') ?:
        "${System.getProperty('user.home')}/.android/pytra-release.properties"
    def propsFile = file(propsPath)
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        releaseSigning = [
            storeFile    : props.getProperty('storeFile'),
            storePassword: props.getProperty('storePassword'),
            keyAlias     : props.getProperty('keyAlias'),
            keyPassword  : props.getProperty('keyPassword'),
        ]
    }
}

// Release version from CI (-PpytraVersionName=1.2.3 -PpytraVersionCode=42); local builds keep the defaults.
def appVersionName = project.findProperty('pytraVersionName') ?: '1.0'
def appVersionCode = (project.findProperty('pytraVersionCode') ?: '1').toString().toInteger()

android {
    namespace = "com.estebanmm13.pytra"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.estebanmm13.pytra"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigning) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
